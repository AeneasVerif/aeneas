on:
  # Run the checks on any push to any branch of the repo that doesn't start with `_`.
  push:
    branches:
      - main
  # Run the check for any pull request. The check is run on a merge between the
  # PR commit and the `main` branch at the time of running the check.
  pull_request:
  # Runs the check when a PR is added to the merge queue.
  merge_group:
  # Makes it possible to run the forkflow by hand from GItHub's interface.
  workflow_dispatch:

# Cancel previous versions of this job that are still running.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  HAS_CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN != '' }}

jobs:
  select-runner:
    uses: ./.github/workflows/select-runner.yml

  nix:
    needs: [select-runner]
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runs_on) }}
    steps:
      - &install_nix # YAML anchor to reduce duplication
        name: Install Nix
        if: ${{ runner.environment == 'github-hosted' }}
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-substituters = https://hacl.cachix.org
            extra-trusted-public-keys = hacl.cachix.org-1:FzsZ2xsByOwKwIWNPII7yMOelJNDZ12mDAj3d1eGX0c=
      - &setup_cachix_push
        name: Set up Cachix push
        if: ${{ runner.environment == 'github-hosted' && env.HAS_CACHIX_AUTH_TOKEN == 'true' }}
        uses: cachix/cachix-action@v17
        with:
          name: hacl
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipAddingSubstituter: true
      - uses: actions/checkout@v4
      - run: nix build -L .#checks.x86_64-linux.aeneas-check-tidiness
      - run: nix build -L .#checks.x86_64-linux.check-charon-pin
      - run: nix build -L .#aeneas
      - run: nix build -L .#checks.x86_64-linux.default

  diff_lean_files:
    needs: [select-runner]
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runs_on) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # deep clone in order to get access to other commits
      - id: lean_cache_key
        # The key covers every input of the Lean build
        run: |
          deps=$(git rev-parse HEAD:backends/lean/lean-toolchain HEAD:backends/lean/lake-manifest.json HEAD:tests/lean/lake-manifest.json | sha256sum | cut -c1-16)
          content=$(git rev-parse HEAD:backends/lean HEAD:tests/lean | sha256sum | cut -c1-16)
          prefix="lean-build-$deps-"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "key=$prefix$content" >> "$GITHUB_OUTPUT"
      - id: lean_cache_lookup
        uses: actions/cache/restore@v6
        with:
          path: &lean_build_paths |
            backends/lean/.lake/build/lib
            backends/lean/.lake/build/ir
            tests/lean/.lake/build/lib
            tests/lean/.lake/build/ir
          key: ${{ steps.lean_cache_key.outputs.key }}
          lookup-only: true
      - id: skip_check
        run: |
          # A cache is only saved after a successful build so if one exists for these inputs we don't need to build again
          if [ "${{ steps.lean_cache_lookup.outputs.cache-hit }}" = true ]; then
              echo 'A Lean build with these inputs already succeeded.'
              echo "CHECK_LEAN=false" >> "$GITHUB_ENV"
          else
              echo 'Either the Lean files have changed or no cache is available for another reason.'
              echo "CHECK_LEAN=true" >> "$GITHUB_ENV"
          fi
          # Two OCaml files are derivatives of the Lean code so we check if they were changed.
          if git diff origin/main --quiet -- src/extract/ExtractBuiltinLean.ml; then
              echo "CHECK_EXTRACT_BUILTIN=false" >> "$GITHUB_ENV"
          else
              echo 'ExtractBuiltinLean.ml was changed in this PR'
              echo "CHECK_EXTRACT_BUILTIN=true" >> "$GITHUB_ENV"
          fi
          if git diff origin/main --quiet -- src/extract/LeanKeywords.ml; then
              echo "CHECK_LEAN_KEYWORDS=false" >> "$GITHUB_ENV"
          else
              echo 'LeanKeywords.ml was changed in this PR'
              echo "CHECK_LEAN_KEYWORDS=true" >> "$GITHUB_ENV"
          fi
    outputs:
      check_lean: ${{ env.CHECK_LEAN }}
      check_extract_builtin: ${{ env.CHECK_EXTRACT_BUILTIN }}
      check_lean_keywords: ${{ env.CHECK_LEAN_KEYWORDS }}
      lean_cache_key: ${{ steps.lean_cache_key.outputs.key }}
      lean_cache_prefix: ${{ steps.lean_cache_key.outputs.prefix }}

  lean:
    needs: [select-runner, diff_lean_files]
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runs_on) }}
    steps:
      - *install_nix
      - *setup_cachix_push
      - uses: actions/checkout@v4
      - if: >-
          needs.diff_lean_files.outputs.check_lean == 'true' ||
          needs.diff_lean_files.outputs.check_extract_builtin == 'true' ||
          needs.diff_lean_files.outputs.check_lean_keywords == 'true'
        # Cache only our own build outputs: the dependencies come from `lake exe cache get`.
        # Without an exact hit, start from the latest build with the same dependencies.
        uses: actions/cache/restore@v6
        with:
          path: *lean_build_paths
          key: ${{ needs.diff_lean_files.outputs.lean_cache_key }}
          restore-keys: ${{ needs.diff_lean_files.outputs.lean_cache_prefix }}
      - if: needs.diff_lean_files.outputs.check_lean == 'true'
        run: nix develop --command bash -c "cd backends/lean && lake exe cache get && lake build Aeneas AeneasMeta --wfail"
      - if: needs.diff_lean_files.outputs.check_lean == 'true'
        # Lean cannot run its tests in the nix sandbox because `elan` will download things
        run: nix develop --command bash -c "cd tests/lean && make"
      - if: >-
          needs.diff_lean_files.outputs.check_lean == 'true' ||
          needs.diff_lean_files.outputs.check_extract_builtin == 'true'
        # Confirm that ExtractBuiltinLean.ml is up to date.
        run: |
          nix develop --command bash -c "make extract-lean-std"
          if git diff --exit-code -- src/extract/ExtractBuiltinLean.ml; then
            echo "ExtractBuiltinLean.ml is up to date."
          else
            echo "ERROR: ExtractBuiltinLean.ml is out of date. Run 'make extract-lean-std'."
            exit 1
          fi
      - if: >-
          needs.diff_lean_files.outputs.check_lean == 'true' ||
          needs.diff_lean_files.outputs.check_lean_keywords == 'true'
        # Confirm that LeanKeywords.ml is up to date.
        run: |
          nix develop --command bash -c "make extract-lean-keywords"
          if git diff --exit-code -- src/extract/LeanKeywords.ml; then
            echo "LeanKeywords.ml is up to date."
          else
            echo "ERROR: LeanKeywords.ml is out of date. Run 'make extract-lean-keywords'."
            exit 1
          fi
      - if: >-
          needs.diff_lean_files.outputs.check_lean == 'true' &&
          (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
        # Save last, so that a cache only exists if all the Lean checks above passed.
        uses: actions/cache/save@v6
        with:
          path: *lean_build_paths
          key: ${{ needs.diff_lean_files.outputs.lean_cache_key }}

  charon-pin-is-forward:
    needs: [select-runner]
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runs_on) }}
    steps:
      - *install_nix
      - *setup_cachix_push
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # deep clone in order to get access to other commits
      - run: nix develop --command ./scripts/ci-check-charon-pin-is-forward.sh

  charon-pin-is-merged:
    needs: [select-runner]
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runs_on) }}
    steps:
      - *install_nix
      - *setup_cachix_push
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # deep clone in order to get access to other commits
      - run: nix develop --command ./scripts/ci-check-charon-pin-is-merged.sh

  userdocs:
    needs: [select-runner]
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runs_on) }}
    steps:
      - *install_nix
      - *setup_cachix_push
      - uses: actions/checkout@v4
      - run: nix build '.?dir=docs/user'#book
        # TODO: test the Lean examples code via nix build '.?dir=docs/user'#test or something similar.
